<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/leaderboard.css') }}">
</head>
<body>

<div class="container mt-5">
    <div class="leaderboard-header text-center mb-4">
        <h1>🏆 Leaderboard</h1>
        <p>Compare users by cash and total assets</p>
    </div>
    
    <h2 class="text-center mb-3">{{ title }}</h2>

    <div class="text-center mb-4">
        <a href="{{ url_for('leaderboard', type='assets') }}"
           class="btn {% if ranking_type == 'assets' %}btn-primary{% else %}btn-outline-primary{% endif %}">
            Total Assets
        </a>

        <a href="{{ url_for('leaderboard', type='cash') }}"
           class="btn {% if ranking_type == 'cash' %}btn-primary{% else %}btn-outline-primary{% endif %}">
            Cash
        </a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>User</th>
                <th>Value ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>🥇 1</td>
                <td>Alice</td>
                <td>12,500</td>
            </tr>
            <tr>
                <td>🥈 2</td>
                <td>Bob</td>
                <td>11,800</td>
            </tr>
            <tr class="current-user">
                <td>🥉 3</td>
                <td>You</td>
                <td>10,950</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Charlie</td>
                <td>9,500</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>

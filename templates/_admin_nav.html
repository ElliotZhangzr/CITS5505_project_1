<style>
    .admin-page .dashboard {
        width: 100%;
        max-width: none;
    }

    .admin-page .panel {
        min-width: 0;
    }

    .admin-page .admin-nav {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        justify-self: stretch;
        width: 100%;
        overflow: visible;
    }

    .admin-page .admin-nav .action-link {
        width: 100%;
        min-height: 44px;
        border-radius: 12px;
        text-align: center;
        white-space: nowrap;
    }

    .admin-page .holding-area,
    .admin-page .admin-summary {
        grid-column: 1 / -1;
        justify-self: stretch;
        width: 100%;
    }

    .admin-page .admin-summary .compact-table table {
        min-width: 0;
    }

    .admin-page .admin-summary tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(56px, auto);
        align-items: center;
        gap: 16px;
    }

    .admin-page .admin-summary th,
    .admin-page .admin-summary td {
        display: block;
    }

    .admin-page .admin-summary td {
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    @media (max-width: 980px) {
        .admin-page .dashboard {
            grid-template-columns: 1fr;
        }

        .admin-page .admin-nav,
        .admin-page .holding-area,
        .admin-page .stock-form-panel,
        .admin-page .admin-messages {
            grid-column: 1 / -1;
        }

        .admin-page .admin-nav {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .admin-page .admin-summary {
            width: 100%;
        }
    }

    @media (max-width: 760px) {
        .admin-page {
            padding-bottom: calc(92px + env(safe-area-inset-bottom));
        }

        .admin-page .dashboard {
            padding: 12px;
            gap: 12px;
        }

        .admin-page .page-header {
            position: sticky;
            top: 0;
            z-index: 40;
            margin: -12px -12px 0;
            border-radius: 0 0 18px 18px;
        }

        .admin-page .admin-nav {
            margin-inline: 0;
            padding: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            justify-self: stretch;
            width: 100%;
            overflow: visible;
        }

        .admin-page .admin-nav .action-link {
            min-width: 0;
            min-height: 46px;
            font-size: 0.86rem;
        }

        .admin-page .admin-summary {
            justify-self: stretch;
            width: 100%;
        }
    }

    @media (max-width: 420px) {
        .admin-page .dashboard {
            padding: 10px;
            gap: 10px;
        }

        .admin-page .panel {
            padding: 14px 12px;
        }

        .admin-page .page-header {
            margin: -10px -10px 0;
        }

        .admin-page .admin-nav {
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .admin-page .admin-nav .action-link {
            min-height: 44px;
            padding: 0 8px;
            font-size: 0.8rem;
        }

        .admin-page .admin-summary tr {
            grid-template-columns: 1fr;
            gap: 4px;
            padding-block: 10px;
        }

        .admin-page .admin-summary th,
        .admin-page .admin-summary td {
            padding: 0;
            border-bottom: 0;
            text-align: left;
        }

        .admin-page .admin-summary td {
            color: var(--muted);
            font-weight: 700;
        }
    }
</style>

<nav class="panel admin-nav" aria-label="Admin navigation">
    <a class="action-link secondary {% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}">Overview</a>
    <a class="action-link secondary {% if request.endpoint in ['admin_users', 'toggle_admin_role'] %}active{% endif %}" href="{{ url_for('admin_users') }}">Users</a>
    <a class="action-link secondary {% if request.endpoint == 'admin_stocks' %}active{% endif %}" href="{{ url_for('admin_stocks') }}">Stocks</a>
    <a class="action-link secondary {% if request.endpoint == 'admin_feedback' %}active{% endif %}" href="{{ url_for('admin_feedback') }}">Feedback</a>
</nav>
